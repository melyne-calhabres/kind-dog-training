[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/accueil"
  to = "/"
  status = 301

[[redirects]]
  from = "/accueil/"
  to = "/"
  status = 301

[[redirects]]
  from = "/educateur-canin-bordeaux"
  to = "/"
  status = 301

[[redirects]]
  from = "/educateur-canin-bordeaux/"
  to = "/"
  status = 301

[[redirects]]
  from = "/tarifs"
  to = "/tarif-educateur-canin-bordeaux"
  status = 301

[[redirects]]
  from = "/tarifs/"
  to = "/tarif-educateur-canin-bordeaux"
  status = 301
